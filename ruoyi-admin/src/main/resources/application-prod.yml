--- # 临时文件存储位置 避免临时文件被系统清理报错
spring.servlet.multipart.location: /ruoyi/server/temp

--- # Flyway 迁移 (PRD-A-012 F-1, prod):
# 首次接入步骤详见 artifacts/Flyway-prod-baseline-SOP.md
# - 步骤 1: 升级前手跑 V_flyway_baseline_init.sql 在 prod DB 建 flyway_schema_history + 标记 V1-V16 success
# - 步骤 2: baseline 完毕后改本字段为 baseline-on-migrate: false (避免重复 baseline)
# - 现 dev 与首次 prod 仍走 true (兼容已有 schema)
spring:
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    table: flyway_schema_history
    validate-on-migrate: true

--- # Actuator 监控端点 (PRD-A-012 D-2: prod 收窄 expose 仅 health/info, 关闭 env/heapdump/beans/configprops 等敏感端点)
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

--- # captcha 验证码 —— 🔴 线上默认开启（安全需求 / PRD-A-005）。与 application-dev.yml 的 false 对称：本地关、线上开。
captcha:
  enable: true

--- # 监控中心配置 (PRD-A-012 D-2: prod 真凭据通过环境变量 MONITOR_USERNAME/MONITOR_PASSWORD 注入, 不再走 @monitor.x@ 占位)
spring.boot.admin.client:
  # 增加客户端开关
  enabled: true
  url: http://localhost:9090/admin
  instance:
    service-host-type: IP
    metadata:
      username: ${spring.boot.admin.client.username}
      userpassword: ${spring.boot.admin.client.password}
  username: ${MONITOR_USERNAME:admin}
  password: ${MONITOR_PASSWORD:__please_set_via_env__}

--- # snail-job 配置 (PRD-A-012 D-3: prod 关掉 — 用户证实未在使用, 仅 RuoYi demo 自带 4 个示例任务 / token 走 env 占位防未来开)
snail-job:
  enabled: false
  group: "ruoyi_group"
  token: ${SNAIL_JOB_TOKEN:placeholder}
  server:
    host: 127.0.0.1
    port: 17888
  namespace: ${spring.profiles.active}
  port: 2${server.port}
  host:

--- # 数据源配置 (prod 凭据从环境变量注入，真值落 部署空间/prod/)
spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    # 动态数据源文档 https://www.kancloud.cn/tracy5546/dynamic-datasource/content
    dynamic:
      # 性能分析插件(有性能损耗 不建议生产环境使用)
      p6spy: false
      # 设置默认的数据源或者数据源组,默认值即为 master
      primary: master
      # 严格模式 匹配不到数据源则报错
      strict: true
      datasource:
        # 主库数据源
        master:
          type: ${spring.datasource.type}
          driverClassName: com.mysql.cj.jdbc.Driver
          # jdbc 所有参数配置参考 https://lionli.blog.csdn.net/article/details/122018562
          # rewriteBatchedStatements=true 批处理优化 大幅提升批量插入更新删除性能(对数据库有性能损耗 使用批量操作应考虑性能问题)
          # prod 凭据通过环境变量注入：BOOK_DB_HOST / BOOK_DB_PORT / BOOK_DB_NAME / BOOK_DB_PASSWORD
          url: jdbc:mysql://${BOOK_DB_HOST:localhost}:${BOOK_DB_PORT:3306}/${BOOK_DB_NAME:misikt_data}?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8&autoReconnect=true&rewriteBatchedStatements=true&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true
          username: ${BOOK_DB_USER:root}
          password: ${BOOK_DB_PASSWORD:<prod-db-password-placeholder>}
#        # 从库数据源
#        slave:
#          lazy: true
#          type: ${spring.datasource.type}
#          driverClassName: com.mysql.cj.jdbc.Driver
#          url: jdbc:mysql://localhost:3306/ry-vue?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8&autoReconnect=true&rewriteBatchedStatements=true&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true
#          username:
#          password:
#        oracle:
#          type: ${spring.datasource.type}
#          driverClassName: oracle.jdbc.OracleDriver
#          url: jdbc:oracle:thin:@//localhost:1521/XE
#          username: ROOT
#          password: root
#        postgres:
#          type: ${spring.datasource.type}
#          driverClassName: org.postgresql.Driver
#          url: jdbc:postgresql://localhost:5432/postgres?useUnicode=true&characterEncoding=utf8&useSSL=true&autoReconnect=true&reWriteBatchedInserts=true
#          username: root
#          password: root
#        sqlserver:
#          type: ${spring.datasource.type}
#          driverClassName: com.microsoft.sqlserver.jdbc.SQLServerDriver
#          url: jdbc:sqlserver://localhost:1433;DatabaseName=tempdb;SelectMethod=cursor;encrypt=false;rewriteBatchedStatements=true
#          username: SA
#          password: root
      hikari:
        # 最大连接池数量
        maxPoolSize: 20
        # 最小空闲线程数量
        minIdle: 10
        # 配置获取连接等待超时的时间
        connectionTimeout: 30000
        # 校验超时时间
        validationTimeout: 5000
        # 空闲连接存活最大时间，默认10分钟
        idleTimeout: 600000
        # 此属性控制池中连接的最长生命周期，值0表示无限生命周期，默认30分钟
        maxLifetime: 1800000
        # 多久检查一次连接的活性
        keepaliveTime: 30000

--- # redis 单机配置 (prod 凭据从环境变量注入，真值落 部署空间/prod/)
spring.data:
  redis:
    # 地址 prod 通过环境变量 BOOK_REDIS_HOST 注入
    host: ${BOOK_REDIS_HOST:localhost}
    # 端口，默认为6379
    port: ${BOOK_REDIS_PORT:6379}
    # 数据库索引
    database: 0
    # redis 密码 prod 通过环境变量 BOOK_REDIS_PASSWORD 注入
    password: ${BOOK_REDIS_PASSWORD:}
    # 连接超时时间
    timeout: 10s
    # 是否开启ssl
    ssl.enabled: false

# redisson 配置
redisson:
  # redis key前缀
  keyPrefix:
  # 线程池数量
  threads: 16
  # Netty线程池数量
  nettyThreads: 32
  # 单节点配置
  singleServerConfig:
    # 客户端名称 不能用中文
    clientName: book-server-prod
    # 最小空闲连接数
    connectionMinimumIdleSize: 32
    # 连接池大小
    connectionPoolSize: 64
    # 连接空闲超时，单位：毫秒
    idleConnectionTimeout: 10000
    # 命令等待超时，单位：毫秒
    timeout: 3000
    # 发布和订阅连接池大小
    subscriptionConnectionPoolSize: 50

--- # mail 邮件发送
mail:
  enabled: false
  host: smtp.163.com
  port: 465
  # 是否需要用户名密码验证
  auth: true
  # 发送方，遵循RFC-822标准
  from: xxx@163.com
  # 用户名（注意：如果使用foxmail邮箱，此处user为qq号）
  user: xxx@163.com
  # 密码（注意，某些邮箱需要为SMTP服务单独设置密码，详情查看相关帮助）
  pass: xxxxxxxxxx
  # 使用 STARTTLS安全连接，STARTTLS是对纯文本通信协议的扩展。
  starttlsEnable: true
  # 使用SSL安全连接
  sslEnable: true
  # SMTP超时时长，单位毫秒，缺省值不超时
  timeout: 0
  # Socket连接超时值，单位毫秒，缺省值不超时
  connectionTimeout: 0

--- # sms 短信 支持 阿里云 腾讯云 云片 等等各式各样的短信服务商
# https://sms4j.com/doc3/ 差异配置文档地址 支持单厂商多配置，可以配置多个同时使用
sms:
  # 配置源类型用于标定配置来源(interface,yaml)
  config-type: yaml
  # 用于标定yml中的配置是否开启短信拦截，接口配置不受此限制
  restricted: true
  # 短信拦截限制单手机号每分钟最大发送，只对开启了拦截的配置有效
  minute-max: 1
  # 短信拦截限制单手机号每日最大发送量，只对开启了拦截的配置有效
  account-max: 30
  # 以下配置来自于 org.dromara.sms4j.provider.config.BaseConfig类中
  blends:
    # 唯一ID 用于发送短信寻找具体配置 随便定义别用中文即可
    # 可以同时存在两个相同厂商 例如: ali1 ali2 两个不同的阿里短信账号 也可用于区分租户
    config1:
      # 框架定义的厂商名称标识，标定此配置是哪个厂商，详细请看厂商标识介绍部分
      supplier: alibaba
      # 有些称为accessKey有些称之为apiKey，也有称为sdkKey或者appId。
      access-key-id: 您的accessKey
      # 称为accessSecret有些称之为apiSecret
      access-key-secret: 您的accessKeySecret
      signature: 您的短信签名
      sdk-app-id: 您的sdkAppId
    config2:
      # 厂商标识，标定此配置是哪个厂商，详细请看厂商标识介绍部分
      supplier: tencent
      access-key-id: 您的accessKey
      access-key-secret: 您的accessKeySecret
      signature: 您的短信签名
      sdk-app-id: 您的sdkAppId

--- # 三方授权 (PRD-A-012 D-4-b: prod 整段关 — 用户证实 14 家三方登录全不用; client-secret 全改占位防框架启动 bean 装配失败)
justauth:
  enabled: false
  # 前端外网访问地址
  address: http://localhost:80
  type:
    maxkey:
      server-url: http://sso.maxkey.top
      client-id: ${JUSTAUTH_MAXKEY_ID:placeholder}
      client-secret: ${JUSTAUTH_MAXKEY_SECRET:placeholder}
      redirect-uri: ${justauth.address}/social-callback?source=maxkey
    topiam:
      server-url: http://127.0.0.1:1989/api/v1/authorize/placeholder
      client-id: ${JUSTAUTH_TOPIAM_ID:placeholder}
      client-secret: ${JUSTAUTH_TOPIAM_SECRET:placeholder}
      redirect-uri: ${justauth.address}/social-callback?source=topiam
      scopes: [ openid, email, phone, profile ]
    qq:
      client-id: ${JUSTAUTH_QQ_ID:placeholder}
      client-secret: ${JUSTAUTH_QQ_SECRET:placeholder}
      redirect-uri: ${justauth.address}/social-callback?source=qq
      union-id: false
    weibo:
      client-id: ${JUSTAUTH_WEIBO_ID:placeholder}
      client-secret: ${JUSTAUTH_WEIBO_SECRET:placeholder}
      redirect-uri: ${justauth.address}/social-callback?source=weibo
    gitee:
      client-id: ${JUSTAUTH_GITEE_ID:placeholder}
      client-secret: ${JUSTAUTH_GITEE_SECRET:placeholder}
      redirect-uri: ${justauth.address}/social-callback?source=gitee
    dingtalk:
      client-id: ${JUSTAUTH_DINGTALK_ID:placeholder}
      client-secret: ${JUSTAUTH_DINGTALK_SECRET:placeholder}
      redirect-uri: ${justauth.address}/social-callback?source=dingtalk
    baidu:
      client-id: ${JUSTAUTH_BAIDU_ID:placeholder}
      client-secret: ${JUSTAUTH_BAIDU_SECRET:placeholder}
      redirect-uri: ${justauth.address}/social-callback?source=baidu
    csdn:
      client-id: ${JUSTAUTH_CSDN_ID:placeholder}
      client-secret: ${JUSTAUTH_CSDN_SECRET:placeholder}
      redirect-uri: ${justauth.address}/social-callback?source=csdn
    coding:
      client-id: ${JUSTAUTH_CODING_ID:placeholder}
      client-secret: ${JUSTAUTH_CODING_SECRET:placeholder}
      redirect-uri: ${justauth.address}/social-callback?source=coding
      coding-group-name: xx
    oschina:
      client-id: ${JUSTAUTH_OSCHINA_ID:placeholder}
      client-secret: ${JUSTAUTH_OSCHINA_SECRET:placeholder}
      redirect-uri: ${justauth.address}/social-callback?source=oschina
    alipay_wallet:
      client-id: ${JUSTAUTH_ALIPAY_ID:placeholder}
      client-secret: ${JUSTAUTH_ALIPAY_SECRET:placeholder}
      redirect-uri: ${justauth.address}/social-callback?source=alipay_wallet
      alipay-public-key: ${JUSTAUTH_ALIPAY_PUBKEY:placeholder}
    wechat_open:
      client-id: ${JUSTAUTH_WECHAT_OPEN_ID:placeholder}
      client-secret: ${JUSTAUTH_WECHAT_OPEN_SECRET:placeholder}
      redirect-uri: ${justauth.address}/social-callback?source=wechat_open
    wechat_mp:
      client-id: ${JUSTAUTH_WECHAT_MP_ID:placeholder}
      client-secret: ${JUSTAUTH_WECHAT_MP_SECRET:placeholder}
      redirect-uri: ${justauth.address}/social-callback?source=wechat_mp
    wechat_enterprise:
      client-id: ${JUSTAUTH_WECHAT_ENT_ID:placeholder}
      client-secret: ${JUSTAUTH_WECHAT_ENT_SECRET:placeholder}
      redirect-uri: ${justauth.address}/social-callback?source=wechat_enterprise
      agent-id: 1000002
    gitlab:
      client-id: ${JUSTAUTH_GITLAB_ID:placeholder}
      client-secret: ${JUSTAUTH_GITLAB_SECRET:placeholder}
      redirect-uri: ${justauth.address}/social-callback?source=gitlab
    gitea:
      server-url: https://demo.gitea.com
      client-id: ${JUSTAUTH_GITEA_ID:placeholder}
      client-secret: ${JUSTAUTH_GITEA_SECRET:placeholder}
      redirect-uri: ${justauth.address}/social-callback?source=gitea

--- # AI 模块占位 (PRD-B-006 骨架; PRD-B-007 填 provider 实现 + 真实凭据)
ai:
  enabled: false
  default-alias:
  fail-over:
    enabled: false
    max-attempts: 3
  aliases: {}
  providers: {}

--- # OCR 模块占位 (PRD-B-006 骨架; PRD-B-007 填 TextinOcrProvider 实现 + 真实凭据)
ocr:
  default-provider:
  textin:
    endpoint:
    app-id:
    secret-code:
    formula-level: 1
    get-image: objects
    timeout: 120s
