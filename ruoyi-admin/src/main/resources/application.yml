# 开发环境配置
server:
  # 服务器的HTTP端口（A 线用户端 8080 / B 线 admin 7888 / C 线 AI 编排 8090；多线共用同一 repo，端口靠目录隔离。
  #   master = A 线 = 8080；master-ai 分支固化 8090 — 跨分支合并时本字段以目标分支线为准）
  #   master-A 分支（PRD-A-016 全栈同步，含 AI 编排）固化 8080 = A 线独立端口。
  port: 8080
  servlet:
    # 应用的访问路径
    context-path: /
  # undertow 配置
  undertow:
    # HTTP post内容的最大大小。当值为-1时，默认值为大小是无限的
    max-http-post-size: 1GB
    # 以下的配置会影响buffer,这些buffer会用于服务器连接的IO操作,有点类似netty的池化内存管理
    # 每块buffer的空间大小,越小的空间被利用越充分
    buffer-size: 512
    # 是否分配的直接内存
    direct-buffers: true
    threads:
      # 设置IO线程数, 它主要执行非阻塞的任务,它们会负责多个连接, 默认设置每个CPU核心一个线程
      io: 8
      # 阻塞任务线程池, 当执行类似servlet请求阻塞操作, undertow会从这个线程池中取得线程,它的值设置取决于系统的负载
      worker: 256

captcha:
  # 是否启用验证码校验
  enable: true
  # 验证码类型 math 数组计算 char 字符验证
  type: math
  # 数字验证码位数
  numberLength: 1
  # 字符验证码长度
  charLength: 4

# 日志配置
logging:
  level:
    org.dromara: @logging.level@
    org.springframework: warn
    org.mybatis.spring.mapper: error
    org.apache.fury: warn
  config: classpath:logback-plus.xml

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  application:
    name: RuoYi-Vue-Plus
  threads:
    # 开启虚拟线程 仅jdk21可用
    virtual:
      enabled: false
  task:
    execution:
      # 从 springboot 3.5 开始 spring自带线程池
      # 不再需要 AsyncConfig与ThreadPoolConfig 可直接注入线程池使用
      thread-name-prefix: async-
      # 由spring自己初始化线程池
      mode: force
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: @profiles.active@
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小（PRD-A-002 B2：路B 整卷 PDF 录题，真实试卷常 >10MB，提到 30MB 对齐 IngestJobController.MAX_FILE_SIZE）
      max-file-size: 30MB
      # 设置总上传的文件大小
      max-request-size: 30MB
  mvc:
    # 设置静态资源路径 防止所有请求都去查静态资源
    static-path-pattern: /static/**
    format:
      date-time: yyyy-MM-dd HH:mm:ss
  jackson:
    # 日期格式化
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      # 格式化输出
      indent_output: false
      # 忽略无法转换的对象
      fail_on_empty_beans: false
    deserialization:
      # 允许对象忽略json中不存在的属性
      fail_on_unknown_properties: false
  # Flyway DB 迁移 (PRD-A-012 F-1, G8 修复 2026-06-09):
  # 🔴 baseline-version=16, baseline-on-migrate=false — 已有库 (dev/prod) 都通过
  # artifacts/Flyway-prod-baseline-SOP.md (或同步的 V_flyway_baseline_init.sql) 手动把
  # flyway_schema_history 灌满 V1-V16 success=1, BE 启动只 validate 16 个 migration 不重跑.
  # 原 baseline-version=0 是 bug — 让 Flyway 把已经手动应用过的 V1-V5 文件再跑一次,
  # 撞上 V6 INSERT 冲突 success=0 卡死, 后续 V7-V16 全部 skip 不写 history (G8 红).
  flyway:
    enabled: true
    # 🔴 2026-06-20 PRD-A-018 基线重置: V1-V24+V901-910 压成单一 V1__baseline。
    #   baseline-on-migrate=true: populated 库(整库覆盖灌入)无 history 时自动 stamp baseline v1, 不跑迁移。
    #   baseline-version=1: 仅 V1__baseline(version 1 ≤ baseline) → flyway 跳过不执行。后续新迁移从 V2 起。
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
    table: flyway_schema_history
    validate-on-migrate: true
    # 🔴 三线预留段必需 (2026-06-11 PRD-A-014 踩出): dev 共用库已记 C 线 V901-904, A 线后续低位号
    # (V19/V20...) 对 Flyway 是 "out of order", 默认 validate 直接拒启。开 out-of-order 允许补 apply;
    # prod 各线库独立无 V9xx, 此开关无副作用 (号唯一不复用即安全, 见 book-ai/CLAUDE.md §3.1)。
    out-of-order: true
    # 🔴 三线共用 dev 库再补 (2026-06-16): B 线 V801 已 apply 到共享库但 C clone 无此文件 (C 用 V901+),
    # 默认 validate 撞 "Detected applied migration not resolved locally: 801" 直接拒启。
    # 忽略 "本地没有但库里已 apply" 的外线迁移; prod 各线库独立无外线 V 号, 无副作用 (同 §3.1)。
    ignore-migration-patterns: "*:missing"

# Sa-Token配置
sa-token:
  # token名称 (同时也是cookie名称)
  token-name: Authorization
  # 是否允许同一账号并发登录 (为true时允许一起登录, 为false时新登录挤掉旧登录)
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个token (为true时所有登录共用一个token, 为false时每次登录新建一个token)
  is-share: false
  # jwt秘钥 (PRD-A-012 D-1: prod 经环境变量 SA_JWT_SECRET 注入, dev 走专用默认值, 不再是开源知名默认 abcdefghijklmnopqrstuvwxyz)
  # 🔴 改密钥后曾撞 /auth/login 500 — 根因已查清(line-a-dev 2026-06-09): Redis 残留旧密钥签发的会话 token,
  #    换密钥后 createLoginSession → logoutByMaxLoginCount → UserActionListener.doLogout → getExtra(旧token) 验签失败抛 SaJwtException.
  #    已在 UserActionListener.cleanOnlineToken 加容错(解不开的旧 token 降级裸删不阻断登录), prod 首次设/轮换 SA_JWT_SECRET 也不再炸.
  jwt-secret-key: ${SA_JWT_SECRET:dev-local-only-jwt-secret-not-for-prod-a012}

# security配置
security:
  # 排除路径
  excludes:
    - /*.html
    - /**/*.html
    - /**/*.css
    - /**/*.js
    - /favicon.ico
    - /error
    - /*/api-docs
    - /*/api-docs/**
    - /warm-flow-ui/config
    # 🔴 C线 AI编排(Dify WF3 组卷)免登录接口 —— Dify 内部 service-to-service 调用,
    #    免去手动管 Sa-Token(token 易随 Redis 会话失效); clientid 为非密公开常量,仅作透传不校验。
    #    业务链路已确认不依赖登录用户(无 LoginHelper/getUserId),免登录安全。
    - /teacher/question/lazyTree
    - /teacher/paper/auto-generate
    # 🔴 课时知识梳理讲义/课件 只读接口(PRD-C-205/207) —— 讲义浏览免登录;登录态时 FE 仍带 token,
    #    读侧用 getLoginIdDefaultNull 拿 viewer 做可见性(官方+机构+我的)。
    #    ⚠️ PRD-C-207 P2(2026-07-03)起白名单收窄:写接口 /teacher/kg/lecture-frag 必须登录(owner==登录者才能写),
    #    故不再整段放行 /teacher/kg/**,逐条列只读端点。
    - /teacher/kg/course/**
    - /teacher/kg/doc/**
    - /teacher/kg/questions
    - /teacher/kg/lecture
    - /teacher/kg/lecture-catalog
    # 🔴 PRD-C-212 D5 未登录漫游(2026-07-04) —— 只放"只读端点"(含 misikt 风格的 POST 读),
    #    以 book-ui src/api/question|paper 实际调用逐条核对; 写接口/个人化接口(收藏/篮子/笔记/
    #    q-folder)一个不放,游客态由 FE 拦截器 401 静默降级。
    #    题库:列表树(lazyTree 已在上方)/分页/详情/相似题/血缘/知识点标签/题目关联卷
    - /teacher/question/page
    - /teacher/question/select/**
    - /teacher/question/similar/**
    - /teacher/question/*/lineage
    - /teacher/question/tagsByKp
    - /teacher/qd/papers/**
    #    卷库:列表树/分页/卷详情(原卷结构页)/原卷预览
    - /teacher/exam/paper/lazyTree
    - /teacher/exam/paper/page
    - /teacher/exam/paper/detail
    - /teacher/paper/source/**
    #    字典(题型/难度/学科/学段等 label 渲染,RuoYi 原生只读查询)
    - /system/dict/data/type/**

# 业务自定义配置
book:
  # book-ui 前端基址 —— AI 组卷落库后拼卷详情深链(/papers/source/{paperId})用; prod 改成真实域名
  # master = A 线 FE :5173（master-ai 分支为 C 线 :8091，跨分支合并时本字段以目标分支线为准）
  front-base-url: http://localhost:5173

# 多租户配置
tenant:
  # 是否开启
  enable: true
  # 排除表
  excludes:
    - sys_menu
    - sys_tenant
    - sys_tenant_package
    - sys_role_dept
    - sys_role_menu
    - sys_user_post
    - sys_user_role
    - sys_client
    - sys_oss_config
    - flow_spel
    # 🔴 PRD-A-012 G4 回归根治（line-a-dev 2026-06-09）：本项目所有 biz_* 业务表均无 tenant_id 列，
    # 是单租户教师产品。原 PRD-A-012 把 @InterceptorIgnore 从各子 mapper 上移到父接口 BizBaseMapper，
    # 因 MyBatis-Plus 用 mapperClass.getAnnotation() 读注解、Java 接口注解不从父接口继承 → 注解失效 →
    # 多租户拦截器对所有 biz_* 表注入 AND tenant_id → "Unknown column 'tenant_id'" 全 500。
    # 改用 tenant.excludes 表级排除（PlusTenantLineHandler.ignoreTable 按表名精确匹配，namespace 无关、最稳）。
    - biz_paper
    - biz_paper_basket
    - biz_paper_category
    - biz_paper_question
    - biz_paper_section
    - biz_question
    - biz_question_annotation
    - biz_question_basket
    - biz_question_favorite
    - biz_question_folder
    - biz_question_knowledge
    - biz_question_note
    - biz_subject
    - biz_text_content
    # XML 裸 SQL join 引用、无独立 @TableName 实体的表（DB 实测全 35 张 biz_ 表均无 tenant_id 列）
    - biz_free_tag
    - biz_question_free_tag
    # PRD-C 举一反三母题图上传留痕表（V904，无 tenant_id，同上单租户约定）
    - biz_variant_upload
    # PRD-A-014 试卷导出任务记录表（V20，无 tenant_id，同上单租户约定）
    - biz_export_record
    # 🔴 PRD-C-100 B4 记忆/经验层（V909/V910，无 tenant_id，同上单租户约定）——
    #   必须列入 tenant.excludes，否则多租户拦截器注入 tenant_id → "Unknown column 'tenant_id'" 全 500。
    - biz_teacher_ai_memory
    - biz_dna_edit_log
    # PRD-A-015 题目结构化网格块存储表（V23，无 tenant_id，同上单租户约定）
    - biz_question_block
    # PRD-A-002 路B 批量录题作业 + 拆出题暂存表（V27，无 tenant_id，同上单租户约定）
    - biz_ingest_job
    - biz_ingest_job_item

# MyBatisPlus配置
# https://baomidou.com/config/
mybatis-plus:
  # 自定义配置 是否全局开启逻辑删除 关闭后 所有逻辑删除功能将失效
  enableLogicDelete: true
  # 多包名使用 例如 org.dromara.**.mapper,org.xxx.**.mapper
  mapperPackage: org.dromara.**.mapper
  # 对应的 XML 文件位置
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 实体扫描，多个package用逗号或者分号分隔
  typeAliasesPackage: org.dromara.**.domain
  global-config:
    dbConfig:
      # 主键类型
      # AUTO 自增 NONE 空 INPUT 用户输入 ASSIGN_ID 雪花 ASSIGN_UUID 唯一 UUID
      # 如需改为自增 需要将数据库表全部设置为自增
      idType: ASSIGN_ID

# 数据加密
mybatis-encryptor:
  # 是否开启加密
  enable: false
  # 默认加密算法
  algorithm: BASE64
  # 编码方式 BASE64/HEX。默认BASE64
  encode: BASE64
  # 安全秘钥 对称算法的秘钥 如：AES，SM4
  password:
  # 公私钥 非对称算法的公私钥 如：SM2，RSA
  publicKey:
  privateKey:

# api接口加密 (PRD-A-012 D-4-a: prod 公私钥经环境变量 API_DECRYPT_PUB / API_DECRYPT_PRI 注入, dev 走默认 demo 密钥)
api-decrypt:
  # 是否开启全局接口加密
  enabled: true
  # AES 加密头标识
  headerFlag: encrypt-key
  # 响应加密公钥 (dev 默认 = open-source demo key, prod 走 env)
  publicKey: ${API_DECRYPT_PUB:MFwwDQYJKoZIhvcNAQEBBQADSwAwSAJBAJnNwrj4hi/y3CCJu868ghCG5dUj8wZK++RNlTLcXoMmdZWEQ/u02RgD5LyLAXGjLOjbMtC+/J9qofpSGTKSx/MCAwEAAQ==}
  # 请求解密私钥 (dev 默认 = open-source demo key, prod 走 env)
  privateKey: ${API_DECRYPT_PRI:}

springdoc:
  api-docs:
    # 是否开启接口文档
    enabled: true
  info:
    # 标题
    title: '标题：RuoYi-Vue-Plus多租户管理系统_接口文档'
    # 描述
    description: '描述：用于管理集团旗下公司的人员信息,具体包括XXX,XXX模块...'
    # 版本
    version: '版本号: ${project.version}'
    # 作者信息
    contact:
      name: Lion Li
      email: crazylionli@163.com
      url: https://gitee.com/dromara/RuoYi-Vue-Plus
  #这里定义了两个分组，可定义多个，也可以不定义
  group-configs:
    - group: 1.演示模块
      packages-to-scan: org.dromara.demo
    - group: 2.通用模块
      packages-to-scan: org.dromara.web
    - group: 3.系统模块
      packages-to-scan: org.dromara.system
    - group: 4.代码生成模块
      packages-to-scan: org.dromara.generator
    - group: 5.工作流模块
      packages-to-scan: org.dromara.workflow

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接
  excludeUrls:
    - /system/notice
    # 🔴 PRD-C-204: 题库录入/格式化是内部结构化数据管线(管理员鉴权,数学内容含 < > 不等式)，
    # XSS 过滤器会把 <...> 当 HTML 标签静默剥除(如 a<10$...">=10" 被吃成乱码 → 破坏不等式/损坏JSON)。
    # 这两组端点排除 XSS 过滤；渲染侧已有 DOMPurify(v-safe-html)兜底，安全不破。
    - /teacher/ingest/**
    - /teacher/format/**
    # 🔴 PRD-C-204 题库核实增维：update-attrs 现收 DNA 文本(solutionSkeleton/hardPoints 含数学 < >)，
    # 不排除则 XssFilter 静默剥 <...> 腐蚀数学。改完需重启 BE 才生效。
    - /teacher/question/update-attrs
    # 🔴 PRD-C-213 教学安排域：lesson 标题/段配置/核心口诀/题干均可含数学 < >，
    # XSS 过滤器会静默剥 <...> 腐蚀内容（备课包渲染/家长文案/回收记录）。全域排除。
    - /teacher/schedule/**

--- # 分布式锁 lock4j 全局配置
lock4j:
  # 获取分布式锁超时时间，默认为 3000 毫秒
  acquire-timeout: 3000
  # 分布式锁的超时时间，默认为 30 秒
  expire: 30000

--- # Actuator 监控端点的配置项
management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: ALWAYS
    logfile:
      external-file: ./logs/sys-console.log

--- # 默认/推荐使用sse推送
sse:
  enabled: true
  path: /resource/sse

--- # websocket
websocket:
  # 如果关闭 需要和前端开关一起关闭
  enabled: false
  # 路径
  path: /resource/websocket
  # 设置访问源地址
  allowedOrigins: '*'

--- # warm-flow工作流配置
warm-flow:
  # 是否开启工作流，默认true
  enabled: true
  # 是否开启设计器ui
  ui: true
  # 是否显示流程图顶部文字
  top-text-show: true
  # 是否渲染节点悬浮提示，默认true
  node-tooltip: true
  # 默认Authorization，如果有多个token，用逗号分隔
  token-name: ${sa-token.token-name},clientid

--- # AI 模块占位 (PRD-B-006 骨架; PRD-B-007 填 provider 实现)
ai:
  # 总开关 — B-006 期 false 空跑; B-007 填实现后改 true
  enabled: false
  # 默认模型别名 — B-006 期空; B-007 填 CLAUDE_FAST 等
  default-alias:
  fail-over:
    enabled: false
    max-attempts: 3
  # 别名映射 — key=别名(如 CLAUDE_FAST), value=providerName#modelName
  aliases: {}
  # provider 列表 — key=provider name(如 lk888), value=配置
  providers: {}

--- # OCR 模块占位 (PRD-B-006 骨架; PRD-B-007 填 TextinOcrProvider 实现)
ocr:
  # 默认 provider — B-006 期空; B-007 填 textin
  default-provider:
  textin:
    endpoint:
    app-id:
    secret-code:
    formula-level: 1
    get-image: objects
    timeout: 120s
