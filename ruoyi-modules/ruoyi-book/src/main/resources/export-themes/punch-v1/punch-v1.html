<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>每日打卡</title>
<style>
/* ═══ punch-v1：三升四每日一练定版版式（2026-07-30 自 gen_每日一练.py 定版 CSS 移植） ═══
   消费 PRD-013 §10.2 模块 JSON；data.paper=question 题目卷 / answer 解析卷。
   与 oralcalc-v1 同一约定：__PAPER_DATA__ 注入 + JS 建 DOM。 */
@page { size: A4; margin: 0; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 210mm; }
/* Times 在前：数字/小数点/半角符号走西文字形（SimSun 半角句点 12pt 下点小距宽，
   小数"3.5"视觉断成"3. 5"——2026-07-30 审计批），汉字回落 SimSun 不受影响 */
body { font-family: "Times New Roman","SimSun","Songti SC",serif; color: #000; }

.sheet { width: 210mm; height: 297mm; padding: 10mm 9mm; position: relative; }
.frame { border: 1.2pt solid #000; height: 100%; position: relative; }

.head { border-bottom: 1.2pt solid #000; padding: 3.6mm 0 2.6mm; text-align: center; }
.head h1 { font-family: "SimHei","Heiti SC",sans-serif; font-size: 23pt; letter-spacing: 1px; white-space: nowrap; }
.head h1 .red { color: #d0021b; }
.head .sub { font-size: 10.5pt; color: #333; letter-spacing: .5px; margin-top: 1.6mm; }
.head .sub b { font-family: "SimHei",sans-serif; color: #d0021b; }

.info { display: flex; justify-content: space-around; align-items: baseline;
        font-size: 11.5pt; padding: 2.6mm 8mm; border-bottom: 1.2pt solid #000; }
.info u { text-decoration: none; border-bottom: .8pt solid #000; display: inline-block; min-width: 24mm; }

.goal { font-size: 10pt; padding: 2mm 4mm; border-bottom: 1.2pt solid #000; line-height: 1.5; }
.goal b { font-family: "SimHei",sans-serif; margin-right: 2mm; }
.goal span { margin-right: 3.5mm; white-space: nowrap; }

section { border-bottom: 1.2pt solid #000; padding: 2.2mm 4mm 2.5mm; }
section.last { border-bottom: none; }
h2 { font-family: "SimHei",sans-serif; font-size: 12.5pt; margin-bottom: 1.8mm; }
h2 small { font-family: "SimSun",serif; font-size: 10.5pt; font-weight: 400; }

.grid { display: grid; }
.grid.oral  { grid-template-columns: repeat(5,1fr); row-gap: 3.6mm; font-size: 12pt; }
.grid.c5 { grid-template-columns: repeat(5,1fr); column-gap: 3mm; font-size: 12pt; }
.grid.c4 { grid-template-columns: repeat(4,1fr); column-gap: 3mm; font-size: 12pt; }
/* 留白档位（2026-07-30 压缩 3mm×3：verifier S6——6 份卷内容微超 297mm 溢出空白第二页） */
.work-v { height: 38mm; } .work-t { height: 33mm; }
.work-a { height: 24mm; }
.app { font-size: 12pt; line-height: 1.7; }
/* 题块渲染（移植自 book-v1）：选项网格 / 版式图 */
.app .opts { margin-top: 1mm; display: grid; grid-template-columns: repeat(auto-fit, minmax(38mm, 1fr)); gap: 1mm 6mm; }
.app .fig { margin: 1.5mm 0 1.5mm 6mm; }
/* 图高 40→30mm（2026-07-30 二压：d9/d4/d6 图题天微溢出致空白第二页） */
.app .fig img { max-width: 100%; max-height: 30mm; object-fit: contain; display: block; }

/* ── 解析卷态 ── */
.ans-mode .grid.oral { row-gap: 3.2mm; font-size: 11pt; }
.ans-mode .grid.c5, .ans-mode .grid.c4 { font-size: 11pt; }
.ans-mode .app { font-size: 11pt; line-height: 1.6; }
b.a { font-family: "Times New Roman","SimHei",sans-serif; }
/* 计算模块小题号（灰小字，作错题记录引用锚） */
.qno { color: #888; font-size: 9pt; margin-right: .4mm; }
/* 脱式分步解析行（縮进对齐算式体） */
.sol-step { display: inline-block; margin-left: 4.5mm; line-height: 1.6; }
/* 轮换位题目卷（2026-07-30 用户拍板+复审二刀）：应用题题块=题面内容+解答区（work-a 基高 24mm、
   每题都有）。均分由 JS 落实（见 balanceWorkAreas——flex 在 Chrome 打印路径不生效，终验实锤）：
   渲染后量 frame 剩余空隙均摊给各解答区 → 两题天然均衡且不压页脚 */
.app .item { margin-bottom: 2.4mm; }
.app .sol { margin-left: 5mm; margin-top: .6mm; line-height: 1.75; }
/* ── 结构型题（2026-07-31 补：三上混合运算特训「二合一 / 树状图」）──
   与计算模块不同，这两型自带作答位（横线 / 空框），不再追加 work-* 留白。 */
.grid.c2 { grid-template-columns: repeat(2,1fr); column-gap: 5mm; row-gap: 2mm; font-size: 12pt; }
.cmb { display: flex; align-items: center; }
.cmb .brace { font-size: 24pt; font-weight: 200; margin: 0 1.6mm 0 .8mm; line-height: 1; }
.cmb .two { line-height: 1.75; }
.ansline { margin: 1mm 0 2.4mm 2mm; font-size: 11.5pt; white-space: nowrap; }
.ansline u { text-decoration: none; border-bottom: .8pt solid #000; display: inline-block;
             min-width: 42mm; text-align: center; }
.tree { text-align: center; }
.tree svg { width: 72mm; height: 41mm; display: block; margin: 0 auto; }
.tree text { font-family: "Times New Roman","SimSun",serif; font-size: 13px; }
.ans-mode .grid.c2 { font-size: 11pt; }
/* 行距 2.4→2.0（复审：D6-B 解析内容偏高时错题记录被顶到页脚压字） */
.rec { font-size: 11pt; line-height: 2.0; }
.rec u { text-decoration: none; border-bottom: .8pt solid #000; display: inline-block; }
.rec .box { margin-right: 2.6mm; white-space: nowrap; }

/* fixed=打印时每页重复（内容超页时页脚不再被内容穿插，第2页也有水印）；
   偏移换算：sheet 左右 padding 9mm、frame 底距页底 10mm+原 bottom 2.5mm → 第1页视觉与 absolute 版一致 */
.foot { position: fixed; left: 9mm; right: 9mm; bottom: 12.5mm; display: flex;
        justify-content: space-between; align-items: center; padding: 0 5mm;
        font-size: 9.5pt; color: #555; }
.foot .day { font-family: "SimHei",sans-serif; }
.wm { font-size: 13pt; color: #555; display: flex; align-items: center; gap: 1.2mm; }
.wm img { height: 4.8mm; display: block; }
</style>
</head>

          if (c.label) { var lb = el('span'); lb.textContent = c.label + '．'; sp.appendChild(lb); }
          (c.content || []).forEach(function (x) {
            if (x.type === 'image' && x.url) sp.appendChild(buildImg(x));
            else if (x.md) { var tx = el('span'); tx.innerHTML = esc(x.md).replace(/\n/g, '<br>'); sp.appendChild(tx); }
          });
          return sp;
        }
        (b.rows || []).forEach(function (row) {
          var cells = row.cells || [];
          /* 空白行整行剥掉（原书作答留白混进 rows 会撑大题面、挤压末题解答区） */
          var hasContent = cells.some(function (c) {
            return (c.type === 'image' && c.url) || c.type === 'option'
                || (c.type === 'text' && trimMd(c.md).trim());
          });
          if (!hasContent) return;
          var options = cells.filter(function (c) { return c.type === 'option'; });
          if (options.length) {            // 选项行 → 网格（对齐 book-v1 .opts）
            var opts = el('div', 'opts');
            options.forEach(function (c) { opts.appendChild(buildOption(c)); });
            wrap.appendChild(opts);
            first = false;
            return;
          }
          cells.forEach(function (c) {
            if (c.type === 'text') {
              var d = el('div');
              d.innerHTML = (first ? '<span class="no">' + (qi + 1) + '．</span>' : '')
                          + esc(trimMd(c.md)).replace(/\n/g, '<br>');
              first = false;
              wrap.appendChild(d);
            } else if (c.type === 'image' && c.url) {
              var fig = el('div', 'fig');
              fig.appendChild(buildImg(c));
              wrap.appendChild(fig);
            }
          });
        });
        if (isAns && b.answer) {
          var sol = el('div', 'sol');
          sol.innerHTML = esc(b.answer).replace(/\n/g, '<br>');
          wrap.appendChild(sol);
        }
        app.appendChild(wrap);
        if (!isAns) app.appendChild(el('div', 'work-a'));
      });
      sec.appendChild(app);
    }

    /* ── 二合一：两个算式合并成一个综合算式（2026-07-31 补，三上混合运算特训）
       items:[{e1,e2,a}]——e1/e2 = 两个分步算式（含 ＝ 与结果），a = 综合算式（含 ＝ 与结果）。
       自带作答横线，不追加 work-* 留白。 ── */
    if (m.type === 'combine') {
      var gc = el('div', 'grid c2');
      (m.items || []).forEach(function (it, ii) {
        var cell = el('div');
        var row = el('div', 'cmb');
        row.appendChild(document.createTextNode('（' + (ii + 1) + '）'));
        row.appendChild(el('span', 'brace', '{'));
        var two = el('div', 'two');
        two.appendChild(document.createTextNode(it.e1 || ''));
        two.appendChild(document.createElement('br'));
        two.appendChild(document.createTextNode(it.e2 || ''));
        row.appendChild(two);
        cell.appendChild(row);
        cell.appendChild(ansLine(it.a, isAns));
        gc.appendChild(cell);
      });
      sec.appendChild(gc);
    }

    /* ── 树状图：先填空，再列综合算式（2026-07-31 补）
       items:[{l,op1,r,mid,op2,other,side,total,a}]——顶层 l op1 r = mid，
       中层 mid 与 other 经 op2 = total（side 指明 mid 在左/右）。 ── */
    if (m.type === 'tree') {
      var gt = el('div', 'grid c2');
      (m.items || []).forEach(function (it) {
        var cell = el('div', 'tree');
        cell.appendChild(buildTree(it, isAns));
        cell.appendChild(ansLine(it.a, isAns));
        gt.appendChild(cell);
      });
      sec.appendChild(gt);
    }

    frame.appendChild(sec);
  });

  /* ── 解析卷：错题记录栏（受 lay.showWrongLog 控制，缺省开） ── */
  if (isAns && lay.showWrongLog !== false) {
    var sec = el('section', 'last');
    var h = el('h2', null, CN[(data.modules || []).length] + '、今日错题记录 ');
    h.appendChild(el('small', null, '（家长核对后填写）'));
    sec.appendChild(h);
    var rec = el('div', 'rec');
    var l1 = el('div'); l1.appendChild(document.createTextNode('做错的题号：'));
    var u1 = el('u'); u1.style.minWidth = '120mm'; l1.appendChild(u1); rec.appendChild(l1);
    var l2 = el('div'); l2.appendChild(document.createTextNode('错在哪里：'));
    ['计算粗心', '方法不会', '抄错数字', '没读懂题'].forEach(function (k) { l2.appendChild(el('span', 'box', '□ ' + k)); });
    var ob = el('span', 'box', '□ 其他 '); var uo = el('u'); uo.style.minWidth = '24mm'; ob.appendChild(uo); l2.appendChild(ob); rec.appendChild(l2);
    var l3 = el('div'); l3.appendChild(document.createTextNode('明天要重做的题：'));
    var u3 = el('u'); u3.style.minWidth = '38mm'; l3.appendChild(u3);
    l3.appendChild(document.createTextNode('　今天用时：')); var u4 = el('u'); u4.style.minWidth = '15mm'; l3.appendChild(u4);
    l3.appendChild(document.createTextNode(' 分钟　家长签字：')); var u5 = el('u'); u5.style.minWidth = '24mm'; l3.appendChild(u5);
    rec.appendChild(l3); sec.appendChild(rec); frame.appendChild(sec);
  } else {
    var secs = frame.querySelectorAll('section');
    if (secs.length) secs[secs.length - 1].className = 'last';
  }

  /* ── 题目卷解答区均分（2026-07-30 复审二刀）：frame 剩余空隙均摊给各 work-a（基高 24mm），
     两题解答区恒等且填满到页脚线，不再"末题吃剩余"。flex 方案在 Chrome 打印不生效，故 JS 落实。 */
  if (!isAns) {
    var workas = Array.prototype.slice.call(frame.querySelectorAll('.app .work-a'));
    if (workas.length) {
      var frameBox = frame.getBoundingClientRect();
      var lastBox = workas[workas.length - 1].getBoundingClientRect();
      var slack = (frameBox.bottom - 2) - lastBox.bottom;   /* -2px≈边框宽 */
      if (slack > 0) {
        var add = slack / workas.length;
        workas.forEach(function (w) {
          w.style.height = (w.getBoundingClientRect().height + add) + 'px';
        });
      }
    }
  }

  /* ── 页脚 ── */
  var foot = el('div', 'foot');
  foot.appendChild(el('span', 'day', '第 ' + data.day + ' 天' + (isAns ? ' · 解析' : '')));
  var wm = el('span', 'wm');
  var img = document.createElement('img'); img.src = CORN_DATA_URI; wm.appendChild(img);
  wm.appendChild(document.createTextNode('玉米练习册'));
  foot.appendChild(wm);
  frame.appendChild(foot);
})();
</script>
</body>
</html>
