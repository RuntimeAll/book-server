<style>
/* ═══ flat-v1：打卡「平摊开」版式（PRD-017 批1，唯一版式事实源）═══
   版式正本 = 举一反三产物/打卡/七上实数的运算打卡/_源/gen_打卡.py 的 CSS，本文件逐行搬来（PT=11.5 已代入）。
   一天一页：单栏平摊，一题一行「N. 计算：<式>＝」，10 行等高平分整页 → 每题下自带作答白。
   消费契约见文件末尾 script 头注释；与 punch-v1 同机制：载荷占位符注入 + 内联 JS 建 DOM。
   数学一律 MathJax tex-svg（MathJax 占位符由宿主渲染时内联，PRD-017 批0 D3=b′）。
   🔴 两个占位符在本文件里各只许出现一次（注释里也不许写全称，注入器是全量替换）。 */
  @page { size: A4; margin: 13mm 14mm; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "SimSun", serif; font-size: 11.50pt; line-height: 1.6; color: #000; }
  .m i, i { font-style: italic; font-family: "Times New Roman", serif; }
  .card { height: 268mm; display: flex; flex-direction: column;
          page-break-after: always; position: relative; }
  .card:last-child { page-break-after: auto; }
  .wm { position: absolute; right: 1mm; bottom: 0; font-family: "SimHei", sans-serif;
        font-size: 13pt; color: #525252; letter-spacing: 2px; }
  .wm img { height: 1.25em; vertical-align: -0.28em; margin-right: 4px; }
  h1 { font-family: "SimHei", sans-serif; font-size: 16.73pt; text-align: center;
       letter-spacing: 1px; margin-bottom: 3px; }
  h1 .ac { color: #c00000; }
  h2 { font-family: "SimHei", sans-serif; font-size: 13.07pt; text-align: center;
       font-weight: normal; letter-spacing: 1px; border-bottom: 2px solid #000;
       padding-bottom: 5px; margin-bottom: 4px; }
  .bar { display: flex; justify-content: space-between; align-items: baseline;
         font-size: 10.98pt; margin-bottom: 3px; }
  .bar .mt { font-family: "SimSun", serif; }
  .bar .tag { font-family: "SimHei", sans-serif; }
  .bar .fill { border-bottom: 1px solid #000; display: inline-block; min-width: 4.6em; }
  /* 平摊开：10 行等高平分剩余版面，题面顶对齐 → 题下即作答区 */
  .list { flex: 1; display: grid; grid-template-columns: 1fr; grid-auto-rows: 1fr; }
  .q { page-break-inside: avoid; padding-top: 2mm; align-self: start; }
  .qn { font-family: "Times New Roman", serif; display: inline-block;
        min-width: 1.6em; text-align: right; }
  .lb { font-family: "SimSun", serif; }
  /* 答案着色：MathJax 输出继承 currentColor，故红色能上到公式（🔴 font-weight 上不去，只保留给纯文本答案） */
  .ans { color: #c00000; font-weight: bold; }
  mjx-container { margin: 0 !important; }
  /* 答案卷：不留白，紧排 */
  body.asheet .list { flex: none; grid-auto-rows: auto; }
  body.asheet .q { padding-top: 0; margin-top: 3.2mm; }
  /* 被过滤模块的提示行（只在真的丢了模块时出现，正常载荷不占位） */
  .skip { font-size: 9.5pt; color: #808080; margin-bottom: 1.5mm; }
</style>

(function () {
  var D = {};
  try { D = JSON.parse(document.getElementById('paper-data').textContent) || {}; } catch (e) { D = {}; }
  var L = D.layout || {};
  var isAns = D.paper === 'answer';
  document.body.className = isAns ? 'asheet' : 'qsheet';

  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  /* 天序号 → 中文（1..99）：与 punch-v1 / 本地出卷脚本同口径 */
  function cnDay(v) {
    var k = parseInt(v, 10);
    if (!k || k < 1) return '';
    var C = '零一二三四五六七八九';
    if (k < 10) return C.charAt(k);
    if (k === 10) return '十';
    if (k < 20) return '十' + C.charAt(k % 10);
    var t = C.charAt(Math.floor(k / 10)) + '十';
    return k % 10 === 0 ? t : t + C.charAt(k % 10);
  }

  /* 字号可调（缺省 11.5 = 版式正本；只有显式传 fontPt 才覆盖，默认路径不动一像素） */
  if (L.fontPt) {
    var pt = parseFloat(L.fontPt), k2 = pt / 11.0;
    var st = document.createElement('style');
    st.textContent = 'body{font-size:' + pt.toFixed(2) + 'pt}'
      + 'h1{font-size:' + (16.0 * k2).toFixed(2) + 'pt}'
      + 'h2{font-size:' + (12.5 * k2).toFixed(2) + 'pt}'
      + '.bar{font-size:' + (10.5 * k2).toFixed(2) + 'pt}';
    document.head.appendChild(st);
  }

  /* 模块：平摊版一天一页，各 flat 模块的题顺次平摊（缺 type 视为 flat）。
     🔴 非 flat 型（oral/vertical/stepwise/combine/tree/rotating…）本主题渲不了，只能丢；
     但**丢得要出声**——静默丢会渲出一张只有页眉的白页，看上去像"这天没录内容"，
     排查要绕一大圈。记下被丢的型，卷面上印一行灰字说明。 */
  var dropped = [];
  var mods = (D.modules || []).filter(function (m) {
    if (!m) return false;
    if (m.type == null || m.type === 'flat') return true;
    var dt = String(m.type);
    if (dropped.indexOf(dt) < 0) dropped.push(dt);
    return false;
  });
  var items = [];
  mods.forEach(function (m) { (m.items || []).forEach(function (it) { if (it) items.push(it); }); });

  /* 主标题：「专题：<红>模块词</红>专项训练（N道）」。
     模块词 = bookTitle 去掉「·…」尾巴与「每日打卡」；accent 标出其中要标红的一段（传 '' 关红字）。 */
  var word = String(D.bookTitle != null ? D.bookTitle : (D.title != null ? D.title : ''));
  var cut = word.search(/[\u00b7\u2027\u30fb]/);
  if (cut > 0) word = word.slice(0, cut);
  word = word.replace(/每日打卡/g, '').replace(/打卡$/, '').trim();
  var acc;
  if (L.accent !== undefined && L.accent !== null) acc = String(L.accent);
  else if (D.accent != null && String(D.accent) && word.indexOf(String(D.accent)) >= 0) acc = String(D.accent);
  else acc = word;
  var titleHtml;
  if (!acc) titleHtml = esc(word);
  else {
    var p = word.indexOf(acc);
    titleHtml = p >= 0
      ? esc(word.slice(0, p)) + '<span class="ac">' + esc(acc) + '</span>' + esc(word.slice(p + acc.length))
      : '<span class="ac">' + esc(word) + '</span>';
  }

  var dayLabel = D.day ? '第' + cnDay(D.day) + '天' : '';
  var subs = [];
  mods.forEach(function (m) { if (m.title) subs.push(String(m.title)); });
  var sub = subs.length ? subs.join('\u3000·\u3000') : String(D.subtitle == null ? '' : D.subtitle);
  var tip = L.tip != null ? String(L.tip) : (D.goals || []).join('；');
  var qPrefix = L.qPrefix != null ? String(L.qPrefix) : '计算：';
  var wm = (L.watermark === false || L.watermark === '') ? null
         : (typeof L.watermark === 'string' ? L.watermark : '玉米练习册');
  var fields = (L.infoFields && L.infoFields.length) ? L.infoFields : ['姓名', '日期', '用时'];

  var o = [];
  o.push('<div class="card">');
  if (wm) o.push('<div class="wm"><img src="' + CORN_DATA_URI + '"/>' + esc(wm) + '</div>');
  o.push('<h1>' + esc(L.titlePrefix != null ? L.titlePrefix : '专题：') + titleHtml
         + esc(L.titleSuffix != null ? L.titleSuffix : '专项训练')
         + '（' + items.length + '道）</h1>');
  o.push('<h2>' + (dayLabel && sub ? esc(dayLabel) + '&emsp;·&emsp;' + esc(sub)
                                    : esc(dayLabel || sub)) + '</h2>');
  if (isAns) {
    o.push('<div class="bar"><span class="tag">参考答案' + (dayLabel ? ' · ' + esc(dayLabel) : '')
           + '</span><span class="mt">' + esc(tip) + '</span></div>');
  } else if (L.showInfo !== false) {
    o.push('<div class="bar"><span class="mt">' + esc(tip) + '</span><span>');
    /* 🔴 分隔的 &emsp; 只加在字段之间，末字段后不留（原型手滑多补一个，卷面右缘会偏） */
    o.push(fields.map(function (f) { return esc(f) + '：<span class="fill"></span>'; }).join('&emsp;'));
    o.push('</span></div>');
  }
  /* 被过滤模块提示行：只在真丢了模块时才输出，正常载荷一个字节都不多（版式零影响） */
  if (dropped.length) {
    o.push('<div class="skip">（本主题不支持的模块类型已略：' + esc(dropped.join('、')) + '）</div>');
  }
  o.push('<div class="list">');
  items.forEach(function (it, i) {
    /* 题面/答案一律 HTML 转义后再交给 MathJax（MathJax 读 textContent）——
       🔴 不转义时 LaTeX 里的 < 会被当标签吞掉（版式坑，2026-08-01 打卡线已踩） */
    var core = '\\(' + esc(it.q) + '\\)＝';
    if (isAns && it.a != null && String(it.a) !== '') {
      core += '<span class="ans">\\(' + esc(it.a) + '\\)</span>';
    }
    o.push('<div class="q"><span class="qn">' + (i + 1) + '.</span>&emsp;'
           + (qPrefix ? '<span class="lb">' + esc(qPrefix) + '</span>' : '') + core + '</div>');
  });
  o.push('</div></div>');
  document.body.insertAdjacentHTML('beforeend', o.join(''));
})();
