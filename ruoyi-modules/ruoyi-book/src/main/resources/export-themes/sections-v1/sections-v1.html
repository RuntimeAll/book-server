<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>每日打卡 · 小节版</title>
<style>
/* ═══ sections-v1：打卡「小节」版式（PRD-017 追加战役，唯一版式事实源）═══
   版式正本 = 举一反三产物/打卡/七上绝对值压轴突破/_源/gen_打卡.py 的 CSS，本文件逐行搬来
   （PT=10.4 已代入：body 10.40 / h1 15.13 / h2 11.82 / .bar 9.93 / asheet 9.67）。
   一天一页：六个类型小节，节内填空题并排两栏、解答题独占整行并按 lines 权重吃掉剩余留白
   （.secbox flex 权重 + .blank flex）→ 页数恒等于天数。
   消费契约见文件末尾 script 头注释；与 punch-v1 / flat-v1 同机制：载荷占位符注入 + 内联 JS 建 DOM。
   数学一律 MathJax tex-svg（MathJax 占位符由宿主渲染时内联，PRD-017 批0 D3=b′；
   本主题目录不放第二份 2.1MB vendor，BE 与本地注入器都回落 flat-v1 目录那份共享事实源）。
   🔴 两个占位符（数据 / MathJax）在本文件里各只许出现一次，注释里也不许写全称——注入器是全量替换。 */
  @page { size: A4; margin: 12mm 13mm; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "SimSun", serif; font-size: 10.40pt; line-height: 1.65; color: #000; }
  i { font-style: italic; font-family: "Times New Roman", serif; }
  sup, sub { font-size: 0.72em; }
  .card { height: 270mm; display: flex; flex-direction: column; padding-bottom: 8mm;
          page-break-after: always; position: relative; }
  .card:last-child { page-break-after: auto; }
  .wm { position: absolute; right: 0; bottom: 0; font-family: "SimHei", sans-serif;
        font-size: 12pt; color: #525252; letter-spacing: 2px; }
  .wm img { height: 1.25em; vertical-align: -0.28em; margin-right: 4px; }
  h1 { font-family: "SimHei", sans-serif; font-size: 15.13pt; text-align: center;
       letter-spacing: 3px; margin-bottom: 1px; }
  h2 { font-family: "SimHei", sans-serif; font-size: 11.82pt; text-align: center;
       font-weight: normal; letter-spacing: 1px; border-bottom: 2px solid #000;
       padding-bottom: 3px; margin-bottom: 3px; }
  .bar { display: flex; justify-content: flex-end; font-size: 9.93pt; margin-bottom: 1px; }
  .bar .tag { font-family: "SimHei", sans-serif; }
  .bar .fill { border-bottom: 1px solid #000; display: inline-block; min-width: 4.6em; }
  .secbox { display: flex; flex-direction: column; min-height: 0;
            page-break-inside: avoid; }   /* 小节整块不被分页切开（节标题不孤行） */
  .sec { margin-top: 3px; border-bottom: 1px solid #000; padding-bottom: 1px;
         display: flex; align-items: baseline; gap: .6em; }
  .sec .nm { font-family: "SimHei", sans-serif; font-size: 1.04em; white-space: nowrap; }
  .sec .mt { font-size: 0.8em; color: #333; }
  .g2 { display: grid; grid-template-columns: 1fr 1fr; column-gap: 7mm; }
  .q { page-break-inside: avoid; margin-top: 3px; }
  .q.wide { grid-column: 1 / -1; }
  .qn { font-family: "SimHei", sans-serif; }
  .opts { display: grid; grid-template-columns: repeat(4, 1fr); margin-top: 1px;
          padding-left: 1.6em; }
  .bl { display: inline-block; border-bottom: 1px solid #000; min-width: 5.4em;
        margin: 0 .15em; }
  .bl.s { min-width: 3.4em; }
  .blank { min-height: 10mm; }      /* 每道解答题至少留得下三四行 */
  .ans { font-weight: bold; }
  /* 数学排版 = MathJax（印刷级）；行内公式不撑乱行距 */
  mjx-container { margin: 0 !important; }
  /* 答案卷：不留白、题面淡、答案黑；高度自然流动，允许一天多页 */
  body.asheet { font-size: 9.67pt; line-height: 1.5; }   /* 答案卷紧排，争取一天一页 */
  body.asheet .card { height: auto; padding-bottom: 10mm; }
  body.asheet .blank { display: none; }
  body.asheet .sec { margin-top: 2px; }
  body.asheet .q { margin-top: 2px; }
  body.asheet .stem { color: #555; }
  body.asheet .g2 { column-gap: 6mm; }
  body.asheet .bl { min-width: 1.6em; }        /* 答案卷不需要作答长横线 */
  body.asheet .ans::before { content: "答："; font-family: "SimHei", sans-serif; }
  body.asheet .ans { margin-left: 1.6em; }
  /* 被过滤模块的提示行（只在真的丢了模块时出现，正常载荷不占位） */
  .skip { font-size: 9.5pt; color: #808080; margin-bottom: 1.5mm; }
</style>

  }
  /* 富文本最小白名单净化（PRD-017 verifier I-1，2026-08-02 装闸）：

     故净化后再进 DOM：仅放行 span(class=bl)/br/sup/sub/i/b/u，其余标签转义为字面；
     一切属性剥除（span 只保留 class="bl"）。行内数学不受影响（\( \) 是文本，MathJax 读 textContent）。 */
  var RICH_OK = { span: 1, br: 1, sup: 1, sub: 1, i: 1, b: 1, u: 1 };
  var RICH_CLS = { bl: 1, s: 1 };          /* span 允许的 class token：bl 作答横线 / s 短横线变体 */
  function rich(s) {
    if (s == null) return '';
    return String(s).replace(/<\/?([a-zA-Z][a-zA-Z0-9-]*)((?:[^>"']|"[^"]*"|'[^']*')*?)(\/?)>/g,
      function (m, tag, attrs, slash) {
        var t = tag.toLowerCase();
        if (!RICH_OK[t]) return m.replace(/</g, '&lt;').replace(/>/g, '&gt;');
        if (m.charAt(1) === '/') return '</' + t + '>';
        var keep = '';

          var cm = /class\s*=\s*(?:"([^"]*)"|'([^']*)'|([^\s>]+))/.exec(attrs);

            if (toks.length) keep = ' class="' + toks.join(' ') + '"';

  function cnNum(v) {
    var k = parseInt(v, 10);
    if (!k || k < 1) return '';
    if (k < 10) return CN.charAt(k);
    if (k === 10) return '十';
    if (k < 20) return '十' + CN.charAt(k % 10);
    var t = CN.charAt(Math.floor(k / 10)) + '十';
    return k % 10 === 0 ? t : t + CN.charAt(k % 10);

  function plainLen(h) {

    o.push('<div class="bar"><span class="tag">参考答案'
           + (dayLabel ? ' \u00b7 ' + esc(dayLabel) : '') + '</span></div>');
  } else if (L.showInfo !== false) {
    o.push('<div class="bar"><span>');
    /* 🔴 分隔的全角空格只加在字段之间，末字段后不留（多补一个，卷面右缘会偏） */
    o.push(fields.map(function (f) { return esc(f) + '：<span class="fill"><' + '/span>'; })
                 .join('\u3000'));
    o.push('</span></div>');
  }
  /* 被过滤模块提示行：只在真丢了模块时才输出，正常载荷一个字节都不多（版式零影响） */
  if (dropped.length) {
    o.push('<div class="skip">（本主题不支持的模块类型已略：' + esc(dropped.join('、')) + '）</div>');
  }
  for (var si = 0; si < mods.length; si++) o.push(secHtml(si, mods[si]));
  o.push('</div>');
  document.body.insertAdjacentHTML('beforeend', o.join(''));
})();
</script>
</body>
</html>
