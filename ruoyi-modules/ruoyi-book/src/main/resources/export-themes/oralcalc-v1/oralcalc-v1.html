<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>口算题卡</title>
<link rel="stylesheet" href="katex/katex.min.css">
<script src="katex/katex.min.js"></script>
<script src="katex/contrib/auto-render.min.js"></script>
<style>
/* ═══ 口算题卡·经典版（设计A定稿 2026-07-17）：圆角外框 + 居中标题双细线 + 下划线信息栏 + 灰题号网格 ═══ */
@page { size: A4; margin: 0; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 210mm; }
body { font-family: "SimSun","Songti SC",serif; color: #1a1a1a; }

.sheet { width: 210mm; min-height: 297mm; padding: 12mm 13mm 10mm; }
.frame { border: 1.2pt solid #2b2b2b; border-radius: 3mm; padding: 8mm 9mm 6mm; min-height: 273mm; position: relative; }
.sheet.noframe .frame { border: none; border-radius: 0; padding: 2mm 1mm; }

h1 { text-align: center; font-family: "SimHei","Microsoft YaHei",sans-serif;
     font-size: 22pt; letter-spacing: 1.5mm; padding-bottom: 3.5mm; }
.rule { border-bottom: 0.8pt solid #2b2b2b; margin: 0 -3mm; }
.rule2 { border-bottom: 0.3pt solid #2b2b2b; margin: 0.8mm -3mm 0; }

.meta { display: flex; justify-content: space-between; font-size: 11.5pt; margin: 5mm 1mm 2mm; }
.meta .line { display: inline-block; width: 22mm; border-bottom: 0.5pt solid #555; height: 4.5mm; }

.grp { font-family: "SimHei","Microsoft YaHei",sans-serif; font-size: 12.5pt; margin: 4mm 0 1mm; page-break-after: avoid; }

.qwrap { margin-top: 4mm; }
.grid { display: grid; margin-bottom: 3mm; }
.item { display: flex; align-items: baseline; font-variant-numeric: tabular-nums; page-break-inside: avoid; }
.item.tall { align-items: flex-start; padding-top: 1mm; }   /* 竖式/脱式：题面顶置，下方留演算空间 */
.item .no { font-size: 8.5pt; color: #999; width: 6.5mm; flex: none; font-family: Arial, sans-serif; }
.item .ans { color: #c00000; font-weight: bold; margin-left: 1mm; }

.foot { position: absolute; bottom: 4.5mm; left: 0; right: 0; text-align: center; font-size: 9pt; color: #888; }
.katex { font-size: 1.04em; }
</style>
</head>
<body>
<div class="sheet" id="sheet">
  <div class="frame" id="frame"></div>
</div>
<script type="application/json" id="paper-data">__PAPER_DATA__</script>
<script>
(function () {
  var data = JSON.parse(document.getElementById('paper-data').textContent);
  var isAnswer = data.paper === 'answer';
  var layout = data.layout || {};
  var numbered = layout.numbered === true;                        // 🔴 默认不带题号（2026-07-18 拍板），layout.numbered:true 才开
  var footer = layout.footer != null ? layout.footer : '每天 10 分钟 · 又快又准';
  var hideTitle = layout.hideTitle === true;
  var hideMeta = layout.hideMeta === true;
  var inkColor = layout.inkColor || null;                         // 题目字色（打印一般留默认近黑）
  var FONT_MAP = { songti: '"SimSun","Songti SC",serif', heiti: '"SimHei","Microsoft YaHei",sans-serif',
                   kaiti: '"KaiTi","STKaiti",serif', yahei: '"Microsoft YaHei",sans-serif' };
  var itemFont = FONT_MAP[layout.fontFamily] || null;
  if (layout.frame === false) document.getElementById('sheet').className = 'sheet noframe';

  // ── 自动填页：竖式/脱式组占固定留白行高，剩余高度分给口算行（行高+字号联动），整页撑满 ──
  var VERT_ROW = layout.verticalRowMm || 36;                      // 竖式：题面下留竖式演算空间
  var TUOSHI_ROW = layout.tuoshiRowMm || 30;                      // 脱式：题面下留分步书写空间
  var oralRows = 0, fixedMm = 0, labelCount = 0;
  (data.groups || []).forEach(function (g) {
    var c = layout.cols || g.cols || 3;
    var rows = Math.ceil((g.items || []).length / c);
    if (g.mode === 'vertical') fixedMm += rows * VERT_ROW;
    else if (g.mode === 'tuoshi') fixedMm += rows * TUOSHI_ROW;
    else oralRows += rows;
    if (g.label) labelCount++;
  });
  // frame 内可用高度 ≈ 273mm - 标题区35 - 信息栏14 - 页脚区10 - 组标题×8 - 组间距×3
  var groupCount = (data.groups || []).length;
  var availMm = 273 - (hideTitle ? 0 : 35) - (hideMeta ? 0 : 14) - 10
      - labelCount * 8 - Math.max(0, groupCount - 1) * 3 - fixedMm;
  var autoRowH = oralRows > 0 ? availMm / oralRows : 13.5;
  var rowH = layout.rowHeightMm || Math.max(11, Math.min(28, autoRowH));
  var fontPt = layout.fontSizePt ||
      (rowH >= 24 ? 19 : rowH >= 20 ? 18 : rowH >= 16 ? 16 : 14);

  var frame = document.getElementById('frame');
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  if (!hideTitle) {
    frame.appendChild(el('h1', null, (data.title || '口算训练') + (isAnswer ? '（答案卷）' : '')));
    frame.appendChild(el('div', 'rule'));
    frame.appendChild(el('div', 'rule2'));
  }

  // 信息栏：题目卷=日期/姓名/用时/做对（layout.metaFields 可换成 班级/学号 等自定义字段）；答案卷=只印日期
  var meta = el('div', 'meta');
  function metaItem(label, tail) {
    var s = document.createElement('span');
    s.appendChild(document.createTextNode(label + '：'));
    s.appendChild(el('span', 'line'));
    if (tail) s.appendChild(document.createTextNode(tail));
    return s;
  }
  if (isAnswer) {
    var d = document.createElement('span');
    d.textContent = data.date || '';
    meta.appendChild(d);
    meta.appendChild(el('span', null, '教师核对用'));
  } else {
    var fields = (layout.metaFields && layout.metaFields.length) ? layout.metaFields : ['日期', '姓名', '用时', '做对'];
    fields.forEach(function (f) {
      meta.appendChild(f === '做对' ? metaItem('做对', '／' + (data.total || '')) : metaItem(f));
    });
  }
  if (!hideMeta) frame.appendChild(meta);

  var wrap = el('div', 'qwrap');
  var no = 0;
  // 🔴 卷面规范(2026-07-19)：组标只印「一、二」序号标识，不写练习内容名（学生自明）
  var ORD = ['一', '二', '三', '四', '五', '六', '七', '八', '九', '十'];
  var grpNo = 0;
  (data.groups || []).forEach(function (g) {
    if (g.label) wrap.appendChild(el('div', 'grp', (ORD[grpNo] || (grpNo + 1)) + '、'));
    if (g.label) grpNo++;
    var grid = el('div', 'grid');
    var cols = layout.cols || g.cols || 3;
    grid.style.gridTemplateColumns = 'repeat(' + cols + ', 1fr)';
    var mode = g.mode || 'oral';
    var gRowH = mode === 'vertical' ? VERT_ROW : mode === 'tuoshi' ? TUOSHI_ROW : rowH;
    (g.items || []).forEach(function (it) {
      no++;
      var d = el('div', 'item' + (mode !== 'oral' ? ' tall' : ''));
      d.style.height = gRowH + 'mm';
      d.style.fontSize = fontPt + 'pt';
      if (itemFont) d.style.fontFamily = itemFont;
      if (inkColor) d.style.color = inkColor;
      if (numbered) d.appendChild(el('span', 'no', no + '.'));
      var q = document.createElement('span');
      // 脱式：题目卷不带＝（学生自己脱式写等号链）；答案卷保留完整式子便于核对
      q.textContent = (mode === 'tuoshi' && !isAnswer) ? it.q.replace(/＝\s*$/, '') : it.q;
      d.appendChild(q);
      if (isAnswer) d.appendChild(el('span', 'ans', it.a));
      grid.appendChild(d);
    });
    wrap.appendChild(grid);
  });
  frame.appendChild(wrap);

  if (footer) frame.appendChild(el('div', 'foot', footer));

  if (window.renderMathInElement) {
    renderMathInElement(document.body, {
      delimiters: [{ left: '$', right: '$', display: false }],
      throwOnError: false
    });
  }
  document.documentElement.setAttribute('data-render-done', '1');
})();
</script>
</body>
</html>
